<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>C&C Pizza Ordering</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; text-align: center; }
        .container { display: flex; justify-content: center; gap: 20px; padding: 40px; }
        .card { background: #2a2a2a; border-radius: 10px; padding: 20px; width: 220px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .card img { width: 100%; height: 140px; border-radius: 8px; object-fit: cover; }
        .btn { background: #ff5722; color: white; border: none; padding: 10px 15px; margin: 5px; cursor: pointer; border-radius: 5px; }
        .btn:hover { background: #e64a19; }
    </style>
</head>
<body>

<h1>Welcome to C&C Pizza Ordering</h1>

<div class="container">
    <!-- Margherita Pizza Card -->
    <div class="card">
        <img src="margherita.jpg" alt="Margherita Pizza">
        <h3>Margherita Pizza</h3>
        <p>1800.00 RS</p>

        <!-- Customization options -->
        <label><input type="checkbox" name="extra" value="Cheese"> Extra Cheese (+300 RS)</label><br>

        <button class="btn" onclick="buyNow('Margherita Pizza', 1800)">Buy</button>
        <button class="btn" onclick="addToCart('Margherita Pizza', 1800)">Add To Cart</button>
    </div>
</div>

<script>
    function buyNow(pizzaName, price) {
        alert(pizzaName + " selected for direct purchase. Price: " + price + " RS");
        // මෙහිදී Backend එකට හෝ Checkout පිටුවට ඩේටා යැවිය හැක
    }

    function addToCart(pizzaName, price) {
        alert(pizzaName + " successfully added to your cart!");
        // Cart Array එකට අයිතමය එකතු කිරීමේ ලොජික් එක මෙහි ලිවිය හැක
    }
</script>

</body>
</html>
